[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-ai"
version = "0.1.0"
description = "진료 녹음에서 의사와 환자를 구분하고 발언을 정리한다"
requires-python = ">=3.10"
dependencies = [
    "av>=12.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
# 전사까지 할 때. 모델은 별도로 받는다. README의 "전사 준비" 참고.
transcribe = ["sherpa-onnx>=1.10"]
dev = ["pytest>=8.0"]

[project.scripts]
voice-transcribe = "voice_ai.transcribe:main"
voice-analyze = "voice_ai.analyze:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
